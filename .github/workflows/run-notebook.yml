name: Run Notebook and Send Email

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 UTC 23시 → 한국시간 08시
  workflow_dispatch:      # 수동 실행도 가능

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install nbconvert papermill yagmail

      - name: Run notebook
        run: |
          papermill your_notebook.ipynb output.ipynb

      - name: Send email
        run: |
          python send_mail.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
